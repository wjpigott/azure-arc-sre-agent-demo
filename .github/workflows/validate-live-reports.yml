name: validate-live-reports

on:
  pull_request:
    paths:
      - "livereports/**"
      - ".github/workflows/validate-live-reports.yml"
  push:
    branches: [main]
    paths:
      - "livereports/**"
      - ".github/workflows/validate-live-reports.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livereports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify report bundles (integrity, CSP nonce, allowed tools)
        run: python3 live_report_bundle.py verify "reports/*.livereport.json"

      - name: Bundles must keep placeholders (no real environment values)
        run: |
          python3 - <<'PY'
          import glob, json, re, sys
          bad = 0
          for f in glob.glob('reports/*.livereport.json'):
              b = json.load(open(f, encoding='utf-8'))
              h = b['spec']['html']
              need = {x['value'] for x in b.get('bindings', []) if x.get('required')}
              missing = [p for p in need if p not in h]
              guids = re.findall(r'\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b', h)
              if not need or missing or guids or b['metadata'].get('sourceAgent'):
                  bad += 1
                  print('FAIL', f, 'placeholders missing:', missing, 'GUIDs:', guids[:3])
              else:
                  print('OK  ', f)
          sys.exit(1 if bad else 0)
          PY

      - name: Template tests
        working-directory: livereports/templates/third-party-software-tracker
        run: node tests/run-tests.js

      - name: Template keeps CONFIG placeholders and an empty snapshot
        run: |
          f=templates/third-party-software-tracker/report/third-party-software-tracker.html
          grep -q "'<SUBSCRIPTION_ID>'" "$f"
          grep -q "const SNAPSHOT = \[\];" "$f"
